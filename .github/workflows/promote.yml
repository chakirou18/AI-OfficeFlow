name: Promote production
on:
  workflow_dispatch:
    inputs:
      development_deployment_id:
        description: Successful development deployment ID to promote unchanged
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Request promotion of the already-deployed tested digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVELOPMENT_ID: ${{ inputs.development_deployment_id }}
        run: python scripts/request_deployment.py production --development-id "$DEVELOPMENT_ID"
