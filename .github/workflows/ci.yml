name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MODEL_MODE: simulated
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: officeflow
      POSTGRES_DB: officeflow_test
      # Public fixture credential for this disposable CI service only.
      POSTGRES_PASSWORD: isolated-ci-fixture
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: officeflow
          POSTGRES_DB: officeflow_test
          POSTGRES_PASSWORD: isolated-ci-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U officeflow -d officeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test dependencies and lightweight lint
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip install ruff==0.14.0
      - name: Python lint
        run: ruff check --select E9,F . ../scripts
      - name: Unit tests
        run: python -m pytest tests/unit -v
      - name: Apply migrations to isolated PostgreSQL
        run: python -m alembic upgrade head
      - name: PostgreSQL integration tests
        run: python -m pytest tests/integration -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Frontend lint
        run: npm run lint
      - name: Type checks and production build
        run: npm run build
