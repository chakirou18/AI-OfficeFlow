global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/analysis-alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: officeflow
    static_configs:
      - targets: [otel-collector:9464]
    scrape_protocols: [OpenMetricsText1.0.0]
