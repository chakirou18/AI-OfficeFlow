name: officeflow

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:-officeflow}
  POSTGRES_DB: ${POSTGRES_DB:-officeflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure_local.py first}

x-api-build: &api-build
  context: ./backend
  target: runtime

services:
  db:
    image: postgres:17-alpine
    environment: *database-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Private Compose network only; no host database port.

  migrate:
    image: officeflow-api:local
    build: *api-build
    environment:
      <<: *database-env
      POSTGRES_HOST: db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: officeflow-api:local
    build: *api-build
    environment:
      <<: *database-env
      POSTGRES_HOST: db
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPS_TOKEN: ${OPS_TOKEN:-}
      MODEL_MODE: ${MODEL_MODE:-simulated}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MAX_CALLS: ${OLLAMA_MAX_CALLS:-20}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      <<: *database-env
      POSTGRES_DB: officeflow_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      MODEL_MODE: simulated
      TELEMETRY_ENABLED: "false"
      <<: *database-env
      POSTGRES_HOST: test-db
      POSTGRES_DB: officeflow_test
    depends_on:
      test-db:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [loki, tempo]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d", "--enable-feature=exemplar-storage"]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on: [otel-collector]

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: monitor
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/officeflow.json
    secrets: [grafana_admin_password]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/sources.yaml:ro
      - ./infra/observability/grafana/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/providers.yaml:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

secrets:
  grafana_admin_password:
    file: ./artifacts/grafana-admin-password
